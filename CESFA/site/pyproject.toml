[project]
name = "cesfa-site"
version = "1.0.0"
description = "CESFA - Centro Educacional Sistema de Gestao"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "bcrypt==4.0.1",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0",
    "aiosqlite>=0.20.0",
]
 
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"