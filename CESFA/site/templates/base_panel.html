<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CESFA{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#f0f2f5;
      color:#333;
      display:flex;
      min-height:100vh;
      overflow-x:hidden;
    }

    img{
      max-width:100%;
      height:auto;
    }

    .sidebar{
      width:260px;
      background:#1a1a2e;
      color:white;
      position:fixed;
      height:100vh;
      transition:all .3s ease;
      z-index:100;
    }

    .sidebar.collapsed{
      width:72px;
    }

    .sidebar-header{
      padding:24px;
      border-bottom:1px solid rgba(255,255,255,.06);
      display:flex;
      align-items:center;
      gap:12px;
    }

    .logo-icon{
      width:42px;
      height:42px;
      border-radius:12px;
      background:linear-gradient(135deg,#e53935,#ff6f60);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .sidebar-nav{
      padding:20px 12px;
    }

    .sidebar-link{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-radius:12px;
      color:rgba(255,255,255,.7);
      text-decoration:none;
      transition:.3s;
      margin-bottom:6px;
    }

    .sidebar-link:hover{
      background:rgba(255,255,255,.08);
      color:white;
    }

    .sidebar-link.active{
      background:rgba(229,57,53,.15);
      color:#ff6f60;
    }

    .main-content{
      margin-left:260px;
      flex:1;
      padding:30px;
      transition:.3s;
    }

    .sidebar.collapsed ~ .main-content{
      margin-left:72px;
    }

    .glass{
      background:white;
      border-radius:18px;
      padding:24px;
      box-shadow:0 2px 12px rgba(0,0,0,.04);
      border:1px solid #eee;
    }

    .top-bar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .btn{
      border:none;
      padding:12px 22px;
      border-radius:12px;
      cursor:pointer;
      font-weight:600;
      transition:.3s;
    }

    .btn-primary{
      background:#e53935;
      color:white;
    }

    .btn-primary:hover{
      background:#c62828;
    }

    .data-table{
      width:100%;
      border-collapse:collapse;
    }

    .data-table th{
      background:#fafafa;
      padding:14px;
      text-align:left;
      border-bottom:2px solid #eee;
    }

    .data-table td{
      padding:14px;
      border-bottom:1px solid #f1f1f1;
    }

    .fade-up{
      opacity:0;
      transform:translateY(20px);
      transition:.5s;
    }

    .fade-up.show{
      opacity:1;
      transform:translateY(0);
    }

    .toast-container{
      position:fixed;
      top:20px;
      right:20px;
      z-index:9999;
    }

    .toast{
      background:white;
      padding:14px 18px;
      border-radius:14px;
      display:flex;
      align-items:center;
      gap:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.15);
      margin-bottom:10px;
      min-width:260px;
    }

    .toast.success{
      border-left:4px solid #059669;
    }

    .toast.error{
      border-left:4px solid #dc2626;
    }

    .toast-close{
      margin-left:auto;
      border:none;
      background:none;
      cursor:pointer;
    }

    button:focus,
    input:focus,
    select:focus,
    a:focus{
      outline:2px solid #e53935;
      outline-offset:2px;
    }

    @media(max-width:768px){

      .sidebar{
        transform:translateX(-100%);
      }

      .sidebar.open{
        transform:translateX(0);
      }

      .main-content{
        margin-left:0 !important;
        padding:18px;
      }

      .top-bar{
        flex-direction:column;
        align-items:flex-start;
        gap:14px;
      }

      .data-table{
        display:block;
        overflow-x:auto;
      }

    }

  </style>

  {% block extra_css %}{% endblock %}
</head>

<body>

<aside class="sidebar" id="sidebar">

  <div class="sidebar-header">

    <div class="logo-icon">
      <i class="fas fa-graduation-cap"></i>
    </div>

    <div>
      <h2>CESFA</h2>
      <p>Sistema Escolar</p>
    </div>

  </div>

  <nav class="sidebar-nav">

    <a href="/dashboard" class="sidebar-link {% block nav_dashboard %}{% endblock %}">
      <i class="fas fa-chart-pie"></i>
      <span>Dashboard</span>
    </a>

    <a href="/alunos" class="sidebar-link {% block nav_alunos %}{% endblock %}">
      <i class="fas fa-user-graduate"></i>
      <span>Alunos</span>
    </a>

    <a href="/notas" class="sidebar-link {% block nav_notas %}{% endblock %}">
      <i class="fas fa-clipboard-list"></i>
      <span>Notas</span>
    </a>

    <a href="/boletim" class="sidebar-link {% block nav_boletim %}{% endblock %}">
      <i class="fas fa-file-alt"></i>
      <span>Boletim</span>
    </a>

  </nav>

</aside>

<main class="main-content">
  {% block content %}{% endblock %}
</main>

<div class="toast-container" id="toastContainer"></div>

<script>

function showToast(msg, type='success') {

  const container = document.getElementById('toastContainer');

  const toast = document.createElement('div');

  toast.className = `toast ${type}`;

  const icon =
    type === 'success'
      ? '<i class="fas fa-check-circle" style="color:#059669;"></i>'
      : '<i class="fas fa-exclamation-circle" style="color:#dc2626;"></i>';

  toast.innerHTML = `
    ${icon}
    <span>${msg}</span>

    <button class="toast-close"
      onclick="this.parentElement.remove()">
      <i class="fas fa-times"></i>
    </button>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    if (toast.parentElement) {
      toast.remove();
    }
  }, 4000);
}

async function doLogout(){

  try{

    await fetch('/api/logout',{
      method:'POST'
    });

  }catch(err){
    console.error(err);
  }

  window.location.href='/login';
}

try{

  if(localStorage.getItem('sidebarCollapsed') === 'true'){
    document.getElementById('sidebar')
      .classList.add('collapsed');
  }

}catch(err){
  console.warn('LocalStorage indisponível');
}

const observer = new IntersectionObserver(entries => {

  entries.forEach((e,i) => {

    if(e.isIntersecting){

      setTimeout(() => {
        e.target.classList.add('show');
      }, i * 50);

    }

  });

},{ threshold:.05 });

window.addEventListener('DOMContentLoaded', () => {

  document
    .querySelectorAll('.fade-up')
    .forEach(el => observer.observe(el));

});

</script>

{% block extra_js %}{% endblock %}

</body>
</html>
