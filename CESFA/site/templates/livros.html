
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Livros</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f5f5f5;
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.formulario{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:30px;
display:flex;
flex-direction:column;
gap:15px;
}

input, textarea{
padding:12px;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#0d6efd;
color:white;
cursor:pointer;
}

.grid-livros{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.livro-card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.livro-card img{
width:100%;
height:250px;
object-fit:cover;
}

.livro-info{
padding:20px;
}

.alto-contraste{
background:black;
color:white;
}

</style>
</head>

<body>

<header class="topbar">
<h1>📚 Painel de Livros</h1>

<div style="display:flex;gap:10px;">
<button onclick="alternarContraste()">Contraste</button>
<button onclick="aumentarFonte()">A+</button>
<button onclick="diminuirFonte()">A-</button>
</div>
</header>

<section class="formulario">

<input type="text" id="titulo" placeholder="Título">
<input type="text" id="autor" placeholder="Autor">
<input type="text" id="categoria" placeholder="Categoria">
<input type="number" id="quantidade" placeholder="Quantidade">
<input type="text" id="capa" placeholder="URL da capa">

<textarea id="descricao" placeholder="Descrição"></textarea>

<button onclick="cadastrarLivro()">Cadastrar Livro</button>

</section>

<div id="painelLivros" class="grid-livros"></div>

<script>

const painel = document.getElementById("painelLivros");

let tamanhoFonte = 16;

async function carregarLivros(){

const response = await fetch("/api/livros");

const livros = await response.json();

painel.innerHTML = "";

livros.forEach(livro => {

painel.innerHTML += `
<div class="livro-card">

<img src="${livro.capa || 'https://via.placeholder.com/300'}">

<div class="livro-info">
<h2>${livro.titulo}</h2>

<p><strong>Autor:</strong> ${livro.autor}</p>
<p><strong>Categoria:</strong> ${livro.categoria}</p>
<p><strong>Quantidade:</strong> ${livro.quantidade}</p>
<p>${livro.descricao}</p>

</div>
</div>
`;

});

}

async function cadastrarLivro(){

const form = new FormData();

form.append("titulo", document.getElementById("titulo").value);
form.append("autor", document.getElementById("autor").value);
form.append("categoria", document.getElementById("categoria").value);
form.append("quantidade", document.getElementById("quantidade").value);
form.append("descricao", document.getElementById("descricao").value);
form.append("capa", document.getElementById("capa").value);

await fetch("/api/livros", {
method:"POST",
body:form
});

carregarLivros();

}

function alternarContraste(){
document.body.classList.toggle("alto-contraste");
}

function aumentarFonte(){
tamanhoFonte += 2;
document.body.style.fontSize = tamanhoFonte + "px";
}

function diminuirFonte(){
tamanhoFonte -= 2;
document.body.style.fontSize = tamanhoFonte + "px";
}

carregarLivros();

setInterval(() => {
carregarLivros();
}, 5000);

</script>

</body>
</html>
